name: Homebrew checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_DEVELOPER: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Tap the checked-out formula
        run: brew tap --custom-remote brandon-cor/tap "$GITHUB_WORKSPACE"
      - name: Check Homebrew style
        run: brew style Formula/agents-on.rb check-stage.rb
      - name: Audit the formula
        run: brew audit --strict --formula brandon-cor/tap/agents-on
      - name: Verify the release and temporary-prefix installation
        run: brew ruby check-stage.rb
